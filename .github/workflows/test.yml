name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test.sh

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./doit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Infinite-RPG-debug
          path: Infinite-RPG-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.3 >/dev/null 2>&1; then
            gh release upload v0.5.3 Infinite-RPG-debug.apk --clobber
          else
            gh release create v0.5.3 Infinite-RPG-debug.apk --title "Infinite RPG 0.5.3" --notes "Clean public build of the recovered Infinite RPG 0.5.3 model-bank release. Model weights are not bundled."
          fi
